# The "(fork)" suffix is the whole point of this line: the plugin list shows
# several Librarian builds side by side once someone has both installed, and
# there is no other way to tell them apart at a glance. The id stays "librarian"
# in manifest, because Stash keys its settings off that and a new id would look
# like a different plugin and orphan every stored setting.
name: Librarian (fork)
description: Organizes your video files on disk according to your specific rules. FORK BUILD - adds a filename byte budget and cross-scene suffixing; not an official release, see the repository for the disclaimer.
# version: injected from package.json at build time
url: https://github.com/GreatCoffee/stash-librarian-fork/tree/main/librarian
exec:
  - librarian.js
interface: js
tasks:
  - name: Rename (filtered)
    description: This task is meant to be triggered elsewhere, clicking this button does nothing
    defaultArgs:
      mode: dummy
  - name: Rename all scenes
    description: Applies Librarian's rename rules to every scene in your Stash
    defaultArgs:
      mode: task
      entity: scenes
  - name: Rename all galleries
    description: Applies Librarian's rename rules to every zip gallery in your Stash. Folder-based galleries are skipped, since Stash cannot rename a gallery folder
    defaultArgs:
      mode: task
      entity: galleries
  - name: Rename all images
    description: Applies Librarian's rename rules to every image in your Stash. Images inside zip galleries are skipped, since Stash cannot rename files within a zip
    defaultArgs:
      mode: task
      entity: images
hooks:
  - name: Auto-rename on scene update
    description: Re-evaluates rename rules whenever an organized scene is updated.
    triggeredBy:
      - Scene.Update.Post
    defaultArgs:
      mode: hook
  - name: Auto-rename on gallery update
    description: Re-evaluates rename rules whenever an organized zip gallery is updated. Off by default.
    triggeredBy:
      - Gallery.Update.Post
    defaultArgs:
      mode: hook
  - name: Auto-rename on image update
    description: Re-evaluates rename rules whenever an organized image is updated. Off by default.
    triggeredBy:
      - Image.Update.Post
    defaultArgs:
      mode: hook
ui:
  javascript:
    - librarian-ui.js
  css:
    - librarian-ui.css
